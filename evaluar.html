<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src https://script.google.com https://script.googleusercontent.com; img-src 'self' data:; frame-src blob:; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Panel de evaluación</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261119d">
</head>
<body>
  <header class="top">
    <div class="logo" data-inicial aria-hidden="true"></div>
    <div class="marca"><span data-marca></span><small data-t="sub_panel"></small></div>
    <div class="idioma" role="group" aria-label="Idioma / Language">
      <button type="button" data-lang="es" lang="es" title="Español">ES</button>
      <button type="button" data-lang="en" lang="en" title="English">EN</button>
    </div>
  </header>

  <main>
    <div id="cargando" class="cargando"><div class="spinner"></div> <span data-t="cargando"></span></div>
    <div id="error-general" class="card" hidden>
      <h1 data-t="e_panel_titulo"></h1>
      <p class="msg err" id="error-general-texto"></p>
      <p class="hint" data-t="e_panel_hint"></p>
    </div>

    <section id="vista-lista" hidden>
      <div class="cabecera">
        <div>
          <div class="etiqueta" id="saludo"></div>
          <h1 id="congreso"></h1>
          <p class="sub" id="bienvenida"></p>
          <p class="plazo" id="plazo" hidden></p>
        </div>
        <div class="avance">
          <span id="avance-texto"></span>
          <div class="barra"><div id="avance-barra"></div></div>
        </div>
      </div>
      <div id="avisos"></div>
      <div class="filtros" role="group" id="filtros">
        <button type="button" data-filtro="todos" data-t="f_todos"></button>
        <button type="button" data-filtro="pendientes" data-t="f_pendientes"></button>
        <button type="button" data-filtro="evaluados" data-t="f_evaluados"></button>
      </div>
      <div id="lista" class="lista"></div>
    </section>

    <section id="vista-detalle" hidden>
      <div class="barra-detalle">
        <button class="enlace-btn" id="volver" type="button" data-t="volver"></button>
        <span class="hint" id="d-posicion"></span>
      </div>
      <div id="d-aviso"></div>
      <div class="card">
        <div class="etiqueta" id="d-codigo"></div>
        <h2 id="d-titulo"></h2>
        <p class="sub" id="d-meta"></p>
        <div class="vista" id="d-vista"></div>
        <div class="original" id="d-original"></div>

        <form id="form" novalidate>
          <div id="criterios"></div>
          <div class="campo">
            <label for="comentario"><span data-t="comentario"></span> <span class="hint" data-t="opcional"></span></label>
            <textarea id="comentario" maxlength="2000"></textarea>
          </div>
          <div class="msg err" id="d-error" role="alert" hidden></div>
          <button type="submit" class="btn bloque" id="guardar"></button>
        </form>
      </div>
    </section>
  </main>

  <footer class="pie" data-t="pie_panel"></footer>

  <script src="config.js?v=20261119d"></script>
  <script src="i18n.js?v=20261119d"></script>
  <script src="api.js?v=20261119d"></script>
  <script src="evaluar.js?v=20261119d"></script>
</body>
</html>
